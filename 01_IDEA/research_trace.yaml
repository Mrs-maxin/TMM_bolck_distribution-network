# Lightweight research trace for route evolution.
# This file is a compact map of decisions, experiments, archived routes, and open questions that affect the paper line.

schema_version: research_template_lite_trace_v1

guide:
  purpose: "记录研究路线如何从初始问题演化到当前主线，并保留有价值的分支和归档路径。"
  provenance_values:
    - user
    - ai-suggested
    - ai-executed
    - user-revised
  provenance_rule: "ai-executed 仅用于已经实际执行并登记结果或 run manifest 的节点；未执行、open 或仍含占位字段的模板节点使用 ai-suggested 或 user。"
  node_types:
    - question
    - decision
    - experiment
    - fork_exploration
    - retained_idea
    - archived_route
    - open_question
  fork_exploration_required_fields:
    - base_node
    - hypothesis
    - git_branch
    - changed_files
    - input_difference
    - compared_with
    - result_directory
    - run_manifest
    - observed_difference
    - decision

tree:
  - id: N01
    type: question
    title: "配电网交流概率潮流中，TMM能否以更少分量比GMM更准确地计算节点电压、支路功率和网损的尾部"
    provenance: user
    status: open
    affects: {claims: [C1, C2], files: ["01_IDEA/claims.md", "02_PAPER/manuscript/method_zh.md"]}
    children:
      - id: N02
        type: experiment
        title: "标准TMM在只有光伏受天气放大的33节点算例中自由度30—200，退化为接近GMM"
        provenance: ai-executed
        status: done
        evidence: [E-PV-FIXED-FORECAST-20261021, E-STD-TMM-DILUTION-20261024]
        result: "原因由method_zh.md式(12)说明：负荷小波动方向稀释峰度"
      - id: N03
        type: decision
        title: "波动强度只作用于由潮流雅可比确定的光伏驱动电压方向（分块TMM，2026-10-21）"
        provenance: user-revised
        status: superseded_by_N07
        evidence: [E-PV-BLOCK-TMM-20261021, E-PV-BLOCK-CHECK-20261021]
      - id: N04
        type: decision
        title: "分块规则改为由注入共同放大判别天气驱动注入并检出潮流二次响应方向（2026-10-22）"
        provenance: ai-executed
        status: adopted
        evidence: [E-SPLIT-RULE-20261022, E-CASE1-NEWSPLIT-20261022]
      - id: N05
        type: decision
        title: "TMM参数由最大似然改为在AQGMM分量归属上按矩确定（2026-10-22）"
        provenance: ai-executed
        status: adopted
        evidence: [E-MOMENT-TMM-20261022]
        lesson: "最大似然降低大偏差场景权重，低估光伏驱动方向方差，K=1尾部比GMM更窄"
      - id: N06
        type: archived_route
        title: "增加拟合场景改善深尾"
        provenance: ai-executed
        status: archived
        observed_issue: "8192增至65536个拟合场景无系统改善；用户确认场景数通常不能增加"
        evidence: [E-EXTREME-WEATHER-20261022]
      - id: N07
        type: decision
        title: "分组t混合：天气过程一阶方向成组、二次响应方向单独成组，强度同步并按出力限值截断（2026-10-23）"
        provenance: user-revised
        status: adopted
        evidence: [E-GROUPED-TMM-20261023, E-GROUPED-REC-20261023]
        literature: "grouped t / grouped normal variance mixture（Daul等2003；Demarta与McNeil 2005；Hintz等2020）"
      - id: N08
        type: archived_route
        title: "各分量共用其余方向残差协方差"
        provenance: ai-executed
        status: archived
        observed_issue: "似然升高，但电压尾部与不共用版本相当，不进入正文方法"
        evidence: [E-PV-SHARED-20261021, E-CASE1-NEWSPLIT-20261022]
      - id: N09
        type: decision
        title: "研究主线锁定为同K尾部更准和少分量达到相近精度；拟合用电压改由快速映射计算；论文方法只保留AQGMM、标准TMM、分组t（2026-10-24）"
        provenance: user
        status: adopted
        evidence: [E-FASTMAP-20261024]
      - id: N10
        type: retained_idea
        title: "多尺度t（AQPPF_TMM主分支方法，各方向独立强度）"
        provenance: user
        status: pending_final_comparison
        retained_reason: "效果与分组t相近；用户要求最终效果差则不放入"
      - id: N11
        type: open_question
        title: "AQGMM尾段误差随K不单调，少分量论点需同口径K曲线"
        provenance: ai-suggested
        status: open
        next_step: "MC方法10⁶场景；AQGMM K=1—16、TMM K=1—8同一评价口径；最终表图换3组拟合场景"
      - id: N12
        type: open_question
        title: "支路P16、P17等由光伏出力停在零或上限决定的支路功率尾部AQGMM更准"
        provenance: ai-suggested
        status: open
        next_step: "区分方法原因（单个对称强度不能表示出力边界处的集中概率）与算例原因（出力限值设定），再决定修改对象"
      - id: N13
        type: open_question
        title: "分组t的电气量解析计算（method_zh.md式(23)）"
        provenance: ai-suggested
        status: open
        next_step: "实现Gauss–Legendre强度积分与Gil-Pelaez反演，并与模型抽样核对"

